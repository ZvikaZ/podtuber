[general]
# the rss file should be served in base_url/podcast_title.rss
# note - it's your responsibility to upload *.rss and files/ to base_url
# (this repository's GitHub Actions workflow publishes output_dir to GitHub Pages)
base_url = 'https://zvikaz.github.io/podtuber/'

# where the .rss files, and an index.html listing them, are written (defaults to the current directory)
output_dir = 'public'

# the index.html page's title and language
title = 'שיעורים - פודקאסטים'
language = 'he'

# each playlist should have it's own [[podcasts]] section
# YouTube playlists are currently disabled: pytube no longer works with YouTube
# [[podcasts]]
# only url is a mandatory field
# url = 'https://www.youtube.com/playlist?list=PL9qFy7xdUfuTE4Xnzran_1ReI_Q0ofL3V'

# all the other podcast field are optional:

# language = 'en-US'

# category and subcategory (if used) should be from from https://podnews.net/article/apple-changed-podcast-categories-2019
# category = "Leisure"
# we can have only category ; we cannot have only subcategory
# both can be omitted
# subcategory = "Video games"

# maybe the mail is needed for Google Podcast indexing
# owner_mail = 'someone@example.com'

# all the other information is retrieved from the YouTube's playlist
# if you need to manually override any of them, open an issue in GitHub

# you can have as many [[podcasts]] as you'd like
# [[podcasts]]
# url = 'https://www.youtube.com/playlist?list=PLmotie7lbYGKYcGymgQALAKxYsKfWnJIb'
# language = 'he-IL'
# category = 'Religion & Spirituality'
# subcategory = 'Judaism'

# a series found on several sites is published once, when the sites have the same lessons, or when one has all of
# the other's lessons and more; when the lessons are identical, the one listed first here is kept

# bneidavid.org: a rav's page is a podcast per series of his; a series' page (https://bneidavid.org/series/...)
# is that series alone
[[podcasts]]
url = 'https://bneidavid.org/rav/הרב-יוסף-קלנר/'
language = 'he-IL'
category = 'Religion & Spirituality'
subcategory = 'Judaism'
image = 'https://static.wixstatic.com/media/413a82_75d0cb10c9e64693a764d1b6a372e49a~mv2.png'

# meirtv.com: a rabbi's page is a podcast per series of his (and one of his lessons in no series);
# a series' page (https://meirtv.com/shiurim-series/...) is that series alone.
# its firewall refuses GitHub's servers, so GitHub's runs use snapshots/meirtv.json; refresh-snapshots.sh updates it
[[podcasts]]
url = 'https://meirtv.com/rabbis/3788/'
language = 'he-IL'
category = 'Religion & Spirituality'
subcategory = 'Judaism'
image = 'https://static.wixstatic.com/media/413a82_75d0cb10c9e64693a764d1b6a372e49a~mv2.png'

# hakotel.org.il: a rabbi's category page is a podcast per series of his; a series' category page is that series
[[podcasts]]
url = 'https://www.hakotel.org.il/category/מאגר-שיעורים-תורני/רבנים/הרב-קלנר-יוסף/'
language = 'he-IL'
category = 'Religion & Spirituality'
subcategory = 'Judaism'
image = 'https://static.wixstatic.com/media/413a82_75d0cb10c9e64693a764d1b6a372e49a~mv2.png'

# haravyosefkalner.com: without ?sidra=..., a podcast for every series on the site
[[podcasts]]
url = 'https://www.haravyosefkalner.com/shiurim'
language = 'he-IL'
category = 'Religion & Spirituality'
subcategory = 'Judaism'

# or just one series (the URL of the series' page)
# [[podcasts]]
# url = 'https://www.haravyosefkalner.com/shiurim?sidra=%D7%90%D7%92%D7%A8%D7%AA+%D7%A2%D7%90+%28%D7%91%D7%A0%D7%99+%D7%93%D7%95%D7%93+%D7%94%D7%AA%D7%A9%D7%A4%D7%91%29'
# language = 'he-IL'

# optionally, any podcast can override its cover image:
# image = 'https://example.com/cover.jpg'
