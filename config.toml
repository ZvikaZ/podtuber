[general]
# the rss file should be served in base_url/podcast_title.rss
# note - it's your responsibility to upload *.rss and files/ to base_url
# (this repository's GitHub Actions workflow publishes output_dir to GitHub Pages)
base_url = 'https://zvikaz.github.io/podtuber/'

# where the .rss files, and an index.html listing them, are written (defaults to the current directory)
output_dir = 'public'

# files published along with them, such as pictures for podcasts' image (defaults to 'static')
static_dir = 'static'

# where runs that can't read a site that refuses them (Meir TV refuses GitHub's) download its snapshot from:
# the snapshots branch, which refresh-snapshots.sh replaces
snapshots_url = 'https://raw.githubusercontent.com/ZvikaZ/podtuber/snapshots/'

# the index.html page's title and language
title = 'שיעורים - פודקאסטים'
language = 'he'

# each playlist should have it's own [[podcasts]] section
# YouTube playlists are currently disabled: pytube no longer works with YouTube
# [[podcasts]]
# only url is a mandatory field
# url = 'https://www.youtube.com/playlist?list=PL9qFy7xdUfuTE4Xnzran_1ReI_Q0ofL3V'

# all the other podcast field are optional:

# language = 'en-US'

# category and subcategory (if used) should be from from https://podnews.net/article/apple-changed-podcast-categories-2019
# category = "Leisure"
# we can have only category ; we cannot have only subcategory
# both can be omitted
# subcategory = "Video games"

# maybe the mail is needed for Google Podcast indexing
# owner_mail = 'someone@example.com'

# all the other information is retrieved from the YouTube's playlist
# if you need to manually override any of them, open an issue in GitHub

# you can have as many [[podcasts]] as you'd like
# [[podcasts]]
# url = 'https://www.youtube.com/playlist?list=PLmotie7lbYGKYcGymgQALAKxYsKfWnJIb'
# language = 'he-IL'
# category = 'Religion & Spirituality'
# subcategory = 'Judaism'

# a series found on several sites is published once, when the sites have the same lessons, or when one has all of
# the other's lessons and more; when the lessons are identical, the one listed first here is kept

# bneidavid.org: a rav's page is a podcast per series of his; a series' page (https://bneidavid.org/series/...)
# is that series alone
[[podcasts]]
url = 'https://bneidavid.org/rav/הרב-יוסף-קלנר/'
language = 'he-IL'
category = 'Religion & Spirituality'
subcategory = 'Judaism'
image = 'https://static.wixstatic.com/media/413a82_75d0cb10c9e64693a764d1b6a372e49a~mv2.png'

# meirtv.com: a rabbi's page is a podcast per series of his (and one of his lessons in no series);
# a series' page (https://meirtv.com/shiurim-series/...) is that series alone.
# its firewall refuses GitHub's servers, so GitHub's runs use its snapshot (see snapshots_url above);
# refresh-snapshots.sh updates it
[[podcasts]]
url = 'https://meirtv.com/rabbis/3788/'
language = 'he-IL'
category = 'Religion & Spirituality'
subcategory = 'Judaism'
image = 'https://static.wixstatic.com/media/413a82_75d0cb10c9e64693a764d1b6a372e49a~mv2.png'

# hakotel.org.il: a rabbi's category page is a podcast per series of his; a series' category page is that series
[[podcasts]]
url = 'https://www.hakotel.org.il/category/מאגר-שיעורים-תורני/רבנים/הרב-קלנר-יוסף/'
language = 'he-IL'
category = 'Religion & Spirituality'
subcategory = 'Judaism'
image = 'https://static.wixstatic.com/media/413a82_75d0cb10c9e64693a764d1b6a372e49a~mv2.png'

# podcasts that already exist: listed and searched on the index page, but subscribed to at their own feeds
# (rav names their rav, for the index page's buttons; source is shown next to their name)
[[podcasts]]
rav = 'הרב אורי שרקי'
source = 'פודקאסט'
feeds = [
    'https://anchor.fm/s/104ca6318/podcast/rss',  # אורות התשובה
    'https://anchor.fm/s/1052e6a84/podcast/rss',  # ספר בראשית
    'https://anchor.fm/s/104ca970c/podcast/rss',  # ספר שמות
    'https://anchor.fm/s/104caa904/podcast/rss',  # ספר ויקרא
    'https://anchor.fm/s/104fb183c/podcast/rss',  # ספר במדבר
    'https://anchor.fm/s/104fb0194/podcast/rss',  # ספר דברים
    'https://anchor.fm/s/104fb27dc/podcast/rss',  # ספר יהושע
    'https://anchor.fm/s/100a3b1e0/podcast/rss',  # ספר שופטים
    'https://anchor.fm/s/104798588/podcast/rss',  # ספר שמואל
    'https://anchor.fm/s/10d33b25c/podcast/rss',  # ספר מלכים
    'https://anchor.fm/s/115a2ab3c/podcast/rss',  # ספר ישעיהו
    'https://anchor.fm/s/107bc12d8/podcast/rss',  # תפילה
    'https://anchor.fm/s/107bc17ec/podcast/rss',  # מאמרי הראיה
    'https://anchor.fm/s/100785068/podcast/rss',  # ספר תומר דבורה
    'https://anchor.fm/s/79879fc8/podcast/rss',  # שיעור יום שישי
    'https://anchor.fm/s/97a77f3c/podcast/rss',  # עשרת הדיברות
    'https://feeds.soundcloud.com/users/soundcloud:users:106769767/sounds.rss',  # כאן ועכשיו - שיחות עם הרב
]

# rav: how to name him, rather than as the site does ('הרב אורי עמוס שרקי'); listed after his own podcasts,
# so that where they're identical, his podcasts are the ones listed
[[podcasts]]
url = 'https://meirtv.com/rabbis/3774/'
rav = 'הרב אורי שרקי'
language = 'he-IL'
category = 'Religion & Spirituality'
subcategory = 'Judaism'
image = 'https://zvikaz.github.io/podtuber/sherki.jpg'

# haravyosefkalner.com: without ?sidra=..., a podcast for every series on the site
[[podcasts]]
url = 'https://www.haravyosefkalner.com/shiurim'
language = 'he-IL'
category = 'Religion & Spirituality'
subcategory = 'Judaism'

