name: Publish podcasts

on:
  schedule:
    - cron: '17 3 * * *'  # daily, so new lessons show up in the feeds
    - cron: '17 10 * * *'  # and after the Meir TV snapshot, refreshed daily at 11:30 Israel time
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run podtuber
      # the Android app (android/), built and published with the site (shiurim.apk); the feeds are published even
      # if it fails to build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build the Android app
        continue-on-error: true
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../public/shiurim.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub disables scheduled workflows after 60 days without repository activity;
  # re-enabling this workflow on every run resets that timer, without any commits
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
