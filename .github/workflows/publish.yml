name: Publish podcasts

on:
  schedule:
    - cron: '17 3 * * *'  # daily, so new lessons show up in the feeds
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run podtuber
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub disables scheduled workflows after 60 days without repository activity;
  # re-enabling this workflow on every run resets that timer, without any commits
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
