name: Publish podcasts

on:
  schedule:
    # every 3 hours, so new lessons show up soon (GitHub often starts these an hour or more late); Meir TV's
    # snapshot is refreshed every 3 hours too, while the computer that refreshes it is on
    - cron: '17 */3 * * *'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run podtuber
      # the Android app (android/), published with the site (shiurim.apk, and shiurim.apk.tree: the git tree of
      # android/ it was built from). It's built only when android/ has changed since; the app published last is
      # kept until then, and if it fails to build (the feeds are published either way)
      - name: Get the app published last
        id: app
        run: |
          base=$(python3 -c "import tomllib; print(tomllib.load(open('config.toml', 'rb'))['general']['base_url'].rstrip('/'))")
          tree=$(git rev-parse HEAD:android)
          if curl -fsS "$base/shiurim.apk.tree" -o "$RUNNER_TEMP/built.tree" && curl -fsS "$base/shiurim.apk" -o public/shiurim.apk; then
            cp "$RUNNER_TEMP/built.tree" public/shiurim.apk.tree
          else
            rm -f public/shiurim.apk "$RUNNER_TEMP/built.tree"
          fi
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "changed=$([ "$(cat "$RUNNER_TEMP/built.tree" 2>/dev/null)" = "$tree" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.app.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build the Android app
        if: steps.app.outputs.changed == 'true'
        continue-on-error: true
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../public/shiurim.apk
          echo "${{ steps.app.outputs.tree }}" > ../public/shiurim.apk.tree
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub disables scheduled workflows after 60 days without repository activity;
  # re-enabling this workflow on every run resets that timer, without any commits
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
